name: iOS Build & Upload

on:
  workflow_dispatch:
    inputs:
      upload_to_appstore:
        description: "Upload to App Store Connect"
        type: boolean
        default: false

concurrency:
  group: ios-build
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  XCODE_VERSION: "26.3"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Install iOS platform
        run: |
          xcrun simctl list > /dev/null
          xcodebuild -downloadPlatform iOS

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Add iOS platform
        run: npm run cap:add-ios -w @dbc/member

      - name: Sync web assets to native project
        run: npm run cap:sync -w @dbc/member

      - name: Generate app icon PNGs
        run: |
          pip3 install --break-system-packages Pillow
          python3 scripts/generate_icons.py

      - name: Install app icon in Xcode asset catalog
        run: |
          ICON_SET=apps/member/ios/App/App/Assets.xcassets/AppIcon.appiconset
          cp apps/member/public/icons/icon-1024.png "$ICON_SET/AppIcon-1024.png"
          cat > "$ICON_SET/Contents.json" << 'JSON'
          {
            "images": [
              {
                "filename": "AppIcon-1024.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          JSON

      - name: Patch AppDelegate for Capacitor 8 + Xcode 16 compatibility
        working-directory: apps/member/ios/App/App
        run: |
          cat > AppDelegate.swift << 'SWIFT'
          import UIKit
          import Capacitor

          @UIApplicationMain
          class AppDelegate: UIResponder, UIApplicationDelegate {

              var window: UIWindow?

              func application(_ application: UIApplication,
                               didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  return true
              }

              func application(_ app: UIApplication,
                               open url: URL,
                               options: [UIApplication.OpenURLOptionsKey: Any] = [:]) -> Bool {
                  return ApplicationDelegateProxy.shared.application(app, open: url, options: options)
              }

              func applicationWillResignActive(_ application: UIApplication) {}
              func applicationDidEnterBackground(_ application: UIApplication) {}
              func applicationWillEnterForeground(_ application: UIApplication) {}
              func applicationDidBecomeActive(_ application: UIApplication) {}
              func applicationWillTerminate(_ application: UIApplication) {}

              func application(_ application: UIApplication,
                               didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)
              }

              func application(_ application: UIApplication,
                               didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
              }
          }
          SWIFT

      - name: Add Push Notifications entitlement
        working-directory: apps/member/ios/App/App
        run: |
          cat > App.entitlements << 'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>aps-environment</key>
              <string>production</string>
          </dict>
          </plist>
          XML

      - name: Register entitlements file in Xcode project
        working-directory: apps/member/ios/App
        run: |
          gem install xcodeproj --no-document
          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('App.xcodeproj')
          target = project.targets.find { |t| t.name == 'App' } || raise('App target not found')
          target.build_configurations.each do |config|
            config.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'App/App.entitlements'
          end
          project.save
          puts "Entitlements registered on App target."
          RUBY

      - name: Set app version from package.json
        working-directory: apps/member
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BUILD=${{ github.run_number }}
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_BUILD=$BUILD" >> "$GITHUB_ENV"

          cd ios/App/App
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" Info.plist

      - name: Set location usage description
        working-directory: apps/member/ios/App/App
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'Dollar Bar Club needs your location to verify you are at the venue when redeeming your drink offer.'" Info.plist 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription 'Dollar Bar Club needs your location to verify you are at the venue when redeeming your drink offer.'" Info.plist

      - name: Install CocoaPods (if needed)
        working-directory: apps/member/ios/App
        run: |
          if [ -f Podfile ]; then
            pod install
          else
            echo "No Podfile found — using Swift Package Manager (Capacitor 6+)"
          fi

      - name: Detect Xcode project type
        working-directory: apps/member/ios/App
        run: |
          if [ -d App.xcworkspace ]; then
            echo "BUILD_TARGET=-workspace App.xcworkspace" >> "$GITHUB_ENV"
          else
            echo "BUILD_TARGET=-project App.xcodeproj" >> "$GITHUB_ENV"
          fi

      - name: Resolve Swift packages
        working-directory: apps/member/ios/App
        run: |
          xcodebuild -resolvePackageDependencies \
            ${{ env.BUILD_TARGET }} \
            -scheme App

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< \
            "$(security cms -D -i "$PROFILE_PATH")")
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID.mobileprovision"

          echo "PROVISION_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Build archive
        working-directory: apps/member/ios/App
        run: |
          set -eo pipefail
          xcodebuild archive \
            ${{ env.BUILD_TARGET }} \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -sdk iphoneos \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=2V4X7M6A4G \
            PROVISIONING_PROFILE_SPECIFIER="${{ env.PROVISION_UUID }}" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PRODUCT_BUNDLE_IDENTIFIER=com.barglance.dollarbarclub \
            MARKETING_VERSION="${{ env.APP_VERSION }}" \
            CURRENT_PROJECT_VERSION="${{ env.APP_BUILD }}" \
            2>&1 | tee $RUNNER_TEMP/build.log
          echo "--- Archive contents ---"
          ls -la $RUNNER_TEMP/App.xcarchive/Products/Applications/ || echo "No archive products found"

      - name: Show build errors (if failed)
        if: failure()
        run: grep -iE '(error:|fatal error|failed)' $RUNNER_TEMP/build.log | head -40 || echo "No error lines found"

      - name: Export IPA
        run: |
          set -eo pipefail
          cat > $RUNNER_TEMP/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>2V4X7M6A4G</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.barglance.dollarbarclub</key>
              <string>${{ env.PROVISION_UUID }}</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            2>&1 | tee $RUNNER_TEMP/export.log | tail -30
          echo "--- Export contents ---"
          ls -la $RUNNER_TEMP/export/ || echo "Export directory not found"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DBC-iOS-${{ env.APP_VERSION }}-build${{ env.APP_BUILD }}
          path: ${{ runner.temp }}/export/*.ipa

      - name: Upload to App Store Connect
        if: inputs.upload_to_appstore
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.private_keys
          KEY_FILE=~/.private_keys/AuthKey_${ASC_KEY_ID}.p8
          if printf '%s' "$ASC_PRIVATE_KEY" | grep -q '\\n'; then
            printf '%b' "$ASC_PRIVATE_KEY" > "$KEY_FILE"
          else
            printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_FILE"
          fi
          chmod 600 "$KEY_FILE"

          echo "--- Key file check ---"
          head -1 "$KEY_FILE"
          wc -l "$KEY_FILE"

          xcrun altool --upload-app \
            -f $RUNNER_TEMP/export/*.ipa \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
